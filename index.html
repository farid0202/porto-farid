<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b17">
  <title>Farid.dev — Dunia Minecraft Interaktif</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>
  
  <div class="top">
    <div class="logo px">FARID<span class="green">.DEV</span></div>
    <div class="hint">Seret untuk memutar · Scroll untuk zoom · Klik bangunan</div>
  </div>
  
  <div id="labels"></div>
  <div class="dock" id="dock"></div>
  
  <aside class="panel" id="panel" aria-live="polite">
    <button class="close" id="close" aria-label="Tutup">✕</button>
    <div id="pc"></div>
  </aside>
  
  <div class="intro" id="intro">
    <div>
      <h1 class="px">FARID<span class="green">.DEV</span></h1>
      <p>Dunia kecil tempat portfolio-ku tinggal. Jelajahi, klik bangunannya, dan kenali aku lewat setiap tempat.</p>
      <button class="btn" id="start">Mulai menjelajah</button>
    </div>
  </div>
  
  <div class="nogl" id="nogl">
    <p>Browser kamu belum bisa menampilkan grafik 3D (WebGL). Coba buka lewat Chrome atau Safari terbaru.</p>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- External JS -->
  <script src="script.js" defer></script>
</body>
</html>
